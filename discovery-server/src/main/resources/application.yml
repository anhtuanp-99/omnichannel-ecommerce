server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # Server độc lập không tự đăng ký và không kéo registry của chính nó
    register-with-eureka: false
    fetch-registry: false
  server:
    # Tắt self-preservation để evict service chết nhanh chóng khi test local
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN