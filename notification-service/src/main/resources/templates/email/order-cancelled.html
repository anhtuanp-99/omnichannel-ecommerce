<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng đã hủy</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; color: #333;">
<div style="background: #d32f2f; color: white; padding: 20px; text-align: center;">
    <h1 style="margin: 0;">Đơn hàng đã hủy</h1>
</div>
<div style="padding: 24px; background: #fafafa;">
    <p>Xin chào <strong th:text="${customerName}">Khách hàng</strong>,</p>
    <p>Đơn hàng của bạn đã bị hủy.</p>

    <div style="background: white; padding: 16px; border-radius: 8px; margin: 16px 0; border-left: 4px solid #d32f2f;">
        <p style="margin: 4px 0;"><strong>Mã đơn hàng:</strong> <span th:text="${orderCode}">ORD-...</span></p>
        <p style="margin: 4px 0;"><strong>Lý do:</strong> <span th:text="${reason}">...</span></p>
        <p style="margin: 4px 0;"><strong>Thời gian hủy:</strong> <span th:text="${cancelledAt}">--/--/----</span></p>
    </div>

    <div th:if="${refundRequired}" style="background: #fff3e0; padding: 12px; border-radius: 8px; margin: 16px 0;">
        <strong>💰 Hoàn tiền:</strong> <span th:text="${refundMessage}"></span>
    </div>

    <p style="margin-top: 32px; font-size: 12px; color: #777;">
        Email tự động — vui lòng không trả lời.<br>
        Omni E-commerce · noreply@omni-ecom.local
    </p>
</div>
</body>
</html>
