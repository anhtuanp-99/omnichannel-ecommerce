server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  application:
    name: payment-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:payment_db}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:CHANGE_ME_IN_LOCAL_OR_ENV}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

app:
  jwt:
    secret: ${JWT_SECRET:REPLACE_WITH_HS256_SECRET_KEY_MIN_32_CHARS_LONG}
  provider:
    mock:
      hmac-secret: ${MOCK_HMAC_SECRET:omni-mock-hmac-secret-min-32-bytes-ok}
      base-url: http://localhost:8084
      webhook-url: http://localhost:8084/api/v1/payments/webhook
  outbox:
    publisher:
      batch-size: 100
      interval-ms: 2000
      max-retry: 5

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        ignoreExceptions:
          - com.omni.common.error.BusinessException
    instances:
      orderClient:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.omni.payment: DEBUG