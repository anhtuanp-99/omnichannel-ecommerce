server:
  port: 8082

spring:
  application:
    name: catalog-service

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/catalog_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_THIS_IS_A_DEV_SECRET_32_BYTES_MINIMUM_OK}
  upload:
    dir: ${UPLOAD_DIR:/tmp/omni-catalog-uploads}
    max-size-bytes: 5242880          # 5MB
    allowed-mime: image/jpeg,image/png,image/webp
  search:
    use-elasticsearch: true          # nếu false → luôn dùng Mongo
  seed:
    enabled: false                   # bật bằng --app.seed.enabled=true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: false
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.omni.catalog: DEBUG
    org.springframework.data.elasticsearch.client: INFO
    org.elasticsearch: WARN