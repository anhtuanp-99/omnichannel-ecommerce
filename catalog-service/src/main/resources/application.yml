server:
  port: ${CATALOG_SERVICE_PORT:8082}

spring:
  application:
    name: catalog-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27018/catalog_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:REPLACE_WITH_HS256_SECRET_KEY_MIN_32_CHARS_LONG}
  upload:
    dir: ${CATALOG_UPLOAD_DIR:${java.io.tmpdir}/omni-catalog-uploads}
    max-size-bytes: 5242880
    allowed-mime: image/jpeg,image/png,image/webp
  search:
    use-elasticsearch: true
  seed:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.omni.catalog: DEBUG
    org.springframework.data.elasticsearch.client: INFO
    org.elasticsearch: WARN