server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        # ===== Identity Service Routes =====
        - id: identity-auth
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
        - id: identity-users
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/users/**
        - id: identity-addresses
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/addresses/**
        - id: identity-admin
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/admin/roles/**

        # ===== Catalog Service Routes =====
        - id: catalog-products
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/catalog/products/**

        - id: catalog-categories
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/catalog/categories/**

        - id: catalog-brands
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/catalog/brands/**

        - id: catalog-images
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/catalog/images/**

        # ===== Order & Inventory Service Routes =====
        - id: order-inventory-cart
          uri: lb://order-inventory-service
          predicates:
            - Path=/api/v1/cart/**
        - id: order-inventory-orders
          uri: lb://order-inventory-service
          predicates:
            - Path=/api/v1/orders/**
        - id: order-inventory-admin-stock
          uri: lb://order-inventory-service
          predicates:
            - Path=/api/v1/admin/stock/**

        # ===== Payment Service Routes =====
        - id: payment-service-customer
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: payment-service-admin
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/admin/payments/**
        - id: payment-service-mock-provider
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/mock-provider/**

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN